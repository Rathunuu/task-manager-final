name: Migration rehearsal

on:
  push:
    branches: ["week-10-shared-projects"]
    paths: [".github/workflows/migration-rehearsal.yml"]

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/migrate-project-owners.js --rehearsal
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
