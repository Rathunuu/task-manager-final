name: Deploy React App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-manager-react/package-lock.json

      - name: Install dependencies
        working-directory: task-manager-react
        run: npm ci

      - name: Build React app
        working-directory: task-manager-react
        run: npm run build -- --base=/task-manager/task-manager-react/

      - name: Prepare Pages folder
        run: |
          mkdir -p dist
          cp index.html app.js render.js storage.js style.css dist/
          mkdir -p dist/task-manager-react
          cp -r task-manager-react/dist/* dist/task-manager-react/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
